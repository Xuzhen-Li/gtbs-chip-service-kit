[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtbs-chip-service-kit"
version = "0.1.0"
description = "Reusable GBTS / capture-panel companion service kit (thin public glue)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xuzhen Li" }]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
gtbs-kit = "gtbs_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
